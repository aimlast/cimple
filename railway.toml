[build]
builder = "NIXPACKS"
# --include=dev is required: Railway's builder exports NODE_ENV=production
# into the build, which makes a bare `npm install` skip devDependencies —
# and vite/esbuild (the build tools) live there. Broke 2026-08-18 when
# Railway updated its build image; "sh: 1: vite: not found", exit 127.
buildCommand = "npm install --include=dev && npm run build"

[deploy]
# `exec` makes node the container's top process: on a redeploy Railway's
# SIGTERM reaches node's graceful-shutdown handler directly and the old copy
# exits 0. Through `npm run start` the wrapper shell/npm died of the signal
# (exit 143) and Railway emailed "Deployment crashed" on every deploy.
startCommand = "npm run db:push && NODE_ENV=production exec node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
